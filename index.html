<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小Q全能账本</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, Arial; padding: 16px; background: #ffffff; margin: 0; }
        .container { max-width: 420px; margin: auto; }
        .card { background: #f8f9fa; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        h2 { margin: 0 0 12px 0; font-size: 18px; color: #333; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .row input, .row select, .row button { flex: 1; min-width: 80px; }
        input, select, button, textarea { padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 10px; outline: none; width: 100%; margin-bottom: 10px; background: #ffffff; font-family: inherit; }
        input:focus, select:focus, textarea:focus { border-color: #007bff; background: white; }
        button { background: #007bff; color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; border-radius: 10px; }
        button:active { transform: scale(0.97); }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        .btn-warning { background: #ffc107; color: #333; }
        .btn-outline { background: transparent; color: #007bff; border: 2px solid #007bff; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .record-item .info { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .record-item .category { background: #e9ecef; padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #666; }
        .record-item .amount { font-weight: 700; color: #dc3545; }
        .record-item .amount.income { font-weight: 700; color: #28a745; }
        .record-item .del { color: #ccc; font-size: 18px; cursor: pointer; padding: 0 6px; }
        .record-item .del:active { color: #dc3545; }
        .tab-bar { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab-bar button { flex: 1; background: #e9ecef; color: #333; border: none; padding: 10px 6px; border-radius: 10px; font-size: 13px; min-width: 60px; }
        .tab-bar .active { background: #007bff; color: white; }
        .chart-container { height: 180px; margin-top: 10px; }
        .empty-tip { text-align: center; color: #999; padding: 30px 0; font-size: 14px; }
        .hidden { display: none; }
        .toast { background: #333; color: white; padding: 12px 20px; border-radius: 10px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 999; font-size: 14px; opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 90%; }
        .toast.show { opacity: 1; }
        .asset-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .asset-item .name { font-weight: 600; }
        .asset-item .bal { color: #28a745; font-weight: 600; }
        .asset-item .bal.negative { color: #dc3545; }
        .asset-actions { display: flex; gap: 6px; }
        .asset-actions button { padding: 4px 12px; font-size: 14px; margin: 0; flex: 0; border-radius: 6px; }
        .total-assets { font-size: 28px; color: #007bff; font-weight: bold; text-align: center; padding: 10px 0; }
        .trend-up { color: #28a745; font-weight: 700; }
        .trend-down { color: #dc3545; font-weight: 700; }
        .balance-chart-container { height: 120px; margin-top: 6px; }
        .balance-row { display: flex; justify-content: space-between; align-items: center; }
        .balance-label { font-size: 14px; color: #888; }
        .balance-number { font-size: 28px; font-weight: bold; color: #333; }
        .balance-detail { display: flex; gap: 20px; margin-top: 4px; }
        .balance-detail-item { font-size: 13px; }
        .balance-detail-item .income-text { color: #28a745; font-weight: 600; }
        .balance-detail-item .expense-text { color: #dc3545; font-weight: 600; }
        .stat-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
        .stat-item .label { color: #666; }
        .stat-item .value { font-weight: 600; }
        .stat-item .percent { color: #888; font-size: 13px; }
        .stat-bar { height: 6px; background: #e9ecef; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .stat-bar .fill { height: 100%; border-radius: 3px; background: #007bff; }
        .stat-card-title { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .stat-summary { display: flex; justify-content: space-around; padding: 10px 0; }
        .stat-summary-item { text-align: center; }
        .stat-summary-item .num { font-size: 22px; font-weight: bold; }
        .stat-summary-item .label { font-size: 12px; color: #888; }
        .stat-summary-item .num.income { color: #28a745; }
        .stat-summary-item .num.expense { color: #dc3545; }
        .edit-asset-input { display: none; margin-top: 6px; }
        .edit-asset-input input { padding: 8px; font-size: 14px; width: 100px; }
        .edit-asset-input button { padding: 6px 12px; font-size: 13px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <div class="toast" id="toast"></div>

    <!-- ===== 顶部标签（删掉了"导入"） ===== -->
    <div class="tab-bar">
        <button class="active" onclick="switchTab('record')">记账</button>
        <button onclick="switchTab('asset')">资产</button>
        <button onclick="switchTab('stats')">统计</button>
    </div>

    <!-- ===== 记账页 ===== -->
    <div id="tab-record">
        <div class="card">
            <h2>流水账</h2>
            <select id="category">
                <option value="餐饮">餐饮</option>
                <option value="交通">交通</option>
                <option value="购物">购物</option>
                <option value="娱乐">娱乐</option>
                <option value="工资">工资</option>
                <option value="其他">其他</option>
            </select>
            <input id="desc" placeholder="项目（如：午餐）">
            <div class="row">
                <input id="amount" placeholder="金额" type="number" step="0.01">
                <select id="type" style="flex:0.7;">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                </select>
            </div>
            <button onclick="addRecord()">提交</button>
        </div>

        <div class="card">
            <div class="balance-row">
                <span class="balance-label">余额</span>
                <span class="balance-number" id="balance">0.00</span>
            </div>
            <div class="balance-detail">
                <span class="balance-detail-item">收入 <span class="income-text" id="totalIncome">0.00</span></span>
                <span class="balance-detail-item">支出 <span class="expense-text" id="totalExpense">0.00</span></span>
            </div>
            <div class="balance-chart-container">
                <canvas id="balanceChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>流水</h2>
            <div id="recordList"></div>
        </div>
    </div>

    <!-- ===== 资产页 ===== -->
    <div id="tab-asset" class="hidden">
        <div class="card">
            <div class="total-assets" id="totalAssets">0.00</div>
            <div id="assetList"></div>
        </div>
        <div class="card">
            <div class="row">
                <input id="assetName" placeholder="账户名（如：微信）" style="flex:2;">
                <input id="assetBalance" placeholder="余额" type="number" step="0.01" style="flex:1;">
            </div>
            <button onclick="addAsset()">提交</button>
        </div>
    </div>

    <!-- ===== 统计页 ===== -->
    <div id="tab-stats" class="hidden">
        <div class="card">
            <div class="stat-summary">
                <div class="stat-summary-item">
                    <div class="num" id="mCount">0</div>
                    <div class="label">笔数</div>
                </div>
                <div class="stat-summary-item">
                    <div class="num income" id="mIncome">0</div>
                    <div class="label">收入</div>
                </div>
                <div class="stat-summary-item">
                    <div class="num expense" id="mExpense">0</div>
                    <div class="label">支出</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="stat-card-title">项目金额占比</div>
            <div id="categoryStatsList"></div>
            <div class="chart-container" style="height:160px; margin-top:10px;">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>每日趋势</h2>
            <div class="chart-container"><canvas id="trendChart"></canvas></div>
        </div>

        <div class="card" style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn-success" onclick="exportData()" style="flex:1;">导出数据</button>
            <button class="btn-danger" onclick="clearAll()" style="flex:1;">清空</button>
        </div>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('records')) || [];
    let assets = JSON.parse(localStorage.getItem('assets')) || [];
    let chartCategory = null, chartTrend = null, chartBalance = null;

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2500);
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
        ['record','asset','stats'].forEach(id => document.getElementById('tab-'+id).classList.add('hidden'));
        const map = { record:0, asset:1, stats:2 };
        document.querySelectorAll('.tab-bar button')[map[tab]].classList.add('active');
        document.getElementById('tab-'+tab).classList.remove('hidden');
        if (tab === 'asset') renderAssets();
        if (tab === 'stats') renderStats();
        if (tab === 'record') renderBalanceChart();
    }

    function addRecord() {
        const desc = document.getElementById('desc').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('type').value;
        const category = document.getElementById('category').value;
        if (!desc || isNaN(amount) || amount <= 0) return showToast('请完整填写项目和金额');
        records.push({
            desc,
            amount: type === 'expense' ? -amount : amount,
            category,
            date: new Date().toISOString()
        });
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
        save();
        showToast('添加成功');
    }

    function del(i) {
        if (confirm('删除这条记录？')) {
            records.splice(i, 1);
            save();
            showToast('已删除');
        }
    }

    function clearAll() {
        if (confirm('确定要删除所有数据吗？')) {
            records = [];
            save();
            showToast('已清空所有数据');
        }
    }

    function save() {
        localStorage.setItem('records', JSON.stringify(records));
        localStorage.setItem('assets', JSON.stringify(assets));
        renderRecords();
        updateBalance();
        renderBalanceChart();
        if (document.getElementById('tab-asset') && !document.getElementById('tab-asset').classList.contains('hidden')) {
            renderAssets();
        }
    }

    function renderRecords() {
        const list = document.getElementById('recordList');
        if (records.length === 0) {
            list.innerHTML = '<div class="empty-tip">暂无记录，记一笔吧</div>';
            return;
        }
        let html = '';
        const sorted = [...records].reverse();
        sorted.forEach((r, idx) => {
            const i = records.indexOf(r);
            const isIncome = r.amount > 0;
            const sign = isIncome ? '+' : '';
            const cls = isIncome ? 'income' : '';
            const date = new Date(r.date).toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
            html += `
                <div class="record-item">
                    <div class="info">
                        <span>${date}</span>
                        <span class="category">${r.category || '其他'}</span>
                        <span>${r.desc}</span>
                    </div>
                    <span>
                        <span class="amount ${cls}">${sign}${Math.abs(r.amount).toFixed(2)}</span>
                        <span class="del" onclick="del(${i})">×</span>
                    </span>
                </div>
            `;
        });
        list.innerHTML = html;
    }

    function updateBalance() {
        let total = 0, income = 0, expense = 0;
        records.forEach(r => {
            total += r.amount;
            if (r.amount > 0) income += r.amount;
            else expense += Math.abs(r.amount);
        });
        document.getElementById('balance').textContent = total.toFixed(2);
        document.getElementById('totalIncome').textContent = income.toFixed(2);
        document.getElementById('totalExpense').textContent = expense.toFixed(2);
    }

    function renderBalanceChart() {
        if (chartBalance) chartBalance.destroy();
        const ctx = document.getElementById('balanceChart').getContext('2d');
        const income = parseFloat(document.getElementById('totalIncome').textContent) || 0;
        const expense = parseFloat(document.getElementById('totalExpense').textContent) || 0;
        chartBalance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['收入', '支出'],
                datasets: [{
                    data: [income, expense],
                    backgroundColor: ['#28a745', '#dc3545'],
                    borderRadius: 6,
                    barThickness: 40
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
            }
        });
    }

    // ===== 资产管理（优化版：编辑+删除） =====
    function addAsset() {
        const name = document.getElementById('assetName').value.trim();
        const balance = parseFloat(document.getElementById('assetBalance').value);
        if (!name) return showToast('请输入账户名');
        if (isNaN(balance)) return showToast('请输入有效余额');
        if (assets.find(a => a.name === name)) return showToast('该账户已存在');
        assets.push({ name, balance });
        document.getElementById('assetName').value = '';
        document.getElementById('assetBalance').value = '';
        save();
        renderAssets();
        showToast('账户添加成功');
    }

    function deleteAsset(name) {
        if (!confirm(`确定删除「${name}」吗？`)) return;
        assets = assets.filter(a => a.name !== name);
        save();
        renderAssets();
        showToast('已删除');
    }

    function editAsset(name) {
        const asset = assets.find(a => a.name === name);
        if (!asset) return;
        const newBalance = prompt(`修改「${name}」的余额：`, asset.balance);
        if (newBalance === null) return;
        const val = parseFloat(newBalance);
        if (isNaN(val) || val < 0) return showToast('请输入有效金额');
        asset.balance = val;
        save();
        renderAssets();
        showToast('已更新');
    }

    function renderAssets() {
        const list = document.getElementById('assetList');
        if (assets.length === 0) {
            list.innerHTML = '<div class="empty-tip">暂无账户，添加一个吧</div>';
            document.getElementById('totalAssets').textContent = '0.00';
            return;
        }
        let html = '';
        let total = 0;
        assets.forEach(a => {
            total += a.balance;
            const cls = a.balance < 0 ? 'negative' : '';
            html += `
                <div class="asset-item">
                    <span class="name">${a.name}</span>
                    <span class="bal ${cls}">${a.balance.toFixed(2)}</span>
                    <div class="asset-actions">
                        <button class="btn-success" onclick="editAsset('${a.name}')" style="padding:4px 12px;font-size:14px;">+</button>
                        <button class="btn-danger" onclick="deleteAsset('${a.name}')" style="padding:4px 12px;font-size:14px;">×</button>
                    </div>
                </div>
            `;
        });
        list.innerHTML = html;
        document.getElementById('totalAssets').textContent = total.toFixed(2);
    }

    // ===== 统计页 =====
    function renderStats() {
        const now = new Date();
        const month = now.getMonth();
        const year = now.getFullYear();
        const monthRecords = records.filter(r => {
            const d = new Date(r.date);
            return d.getMonth() === month && d.getFullYear() === year;
        });
        let mIncome = 0, mExpense = 0;
        monthRecords.forEach(r => {
            if (r.amount > 0) mIncome += r.amount;
            else mExpense += Math.abs(r.amount);
        });
        document.getElementById('mCount').textContent = monthRecords.length;
        document.getElementById('mIncome').textContent = mIncome.toFixed(0);
        document.getElementById('mExpense').textContent = mExpense.toFixed(0);

        // 分类统计（支出）
        const catMap = {};
        records.filter(r => r.amount < 0).forEach(r => {
            const cat = r.category || '其他';
            catMap[cat] = (catMap[cat] || 0) + Math.abs(r.amount);
        });
        const totalExpense = Object.values(catMap).reduce((a, b) => a + b, 0);
        const catLabels = Object.keys(catMap);
        const catData = Object.values(catMap);

        // 渲染分类列表（带进度条和占比）
        const listContainer = document.getElementById('categoryStatsList');
        if (catLabels.length === 0) {
            listContainer.innerHTML = '<div class="empty-tip">暂无支出数据</div>';
        } else {
            let html = '';
            const colors = ['#007bff', '#dc3545', '#ffc107', '#17a2b8', '#28a745', '#6c757d', '#e83e8c', '#fd7e14'];
            catLabels.forEach((label, idx) => {
                const val = catData[idx];
                const percent = totalExpense > 0 ? (val / totalExpense * 100) : 0;
                const color = colors[idx % colors.length];
                html += `
                    <div class="stat-item">
                        <span class="label">${label}</span>
                        <span><span class="value">${val.toFixed(0)}</span><span class="percent"> ${percent.toFixed(1)}%</span></span>
                    </div>
                    <div class="stat-bar"><div class="fill" style="width:${percent}%;background:${color};"></div></div>
                `;
            });
            listContainer.innerHTML = html;
        }

        // 饼图
        if (chartCategory) chartCategory.destroy();
        const ctx1 = document.getElementById('categoryChart').getContext('2d');
        chartCategory = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: catLabels.length ? catLabels : ['暂无数据'],
                datasets: [{ data: catLabels.length ? catData : [1], backgroundColor: ['#007bff','#dc3545','#ffc107','#17a2b8','#28a745','#6c757d','#e83e8c','#fd7e14'] }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { font: { size: 11 } } }
                }
            }
        });

        // 每日趋势
        const days = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            days.push(d.toISOString().slice(0,10));
        }
        const trendData = days.map(day => {
            let sum = 0;
            records.filter(r => r.amount < 0 && r.date.startsWith(day)).forEach(r => sum += Math.abs(r.amount));
            return sum;
        });
        if (chartTrend) chartTrend.destroy();
        const ctx2 = document.getElementById('trendChart').getContext('2d');
        chartTrend = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: days.map(d => d.slice(5)),
                datasets: [{ label: '支出', data: trendData, borderColor: '#dc3545', tension: 0.2, fill: false }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }

    function exportData() {
        if (records.length === 0) return showToast('没有数据可导出');
        let text = '日期,类型,分类,项目,金额\n';
        records.forEach(r => {
            const type = r.amount > 0 ? '收入' : '支出';
            text += `${r.date.slice(0,10)},${type},${r.category || '其他'},${r.desc},${Math.abs(r.amount).toFixed(2)}\n`;
        });
        const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `账本_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
        showToast('导出成功');
    }

    // ===== 初始化 =====
    renderRecords();
    updateBalance();
    renderAssets();
    renderBalanceChart();
</script>
</body>
</html>
