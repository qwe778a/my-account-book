<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小Q智能账本</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, Arial; padding: 16px; background: #f0f2f5; margin: 0; }
        .container { max-width: 420px; margin: auto; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { margin: 0 0 12px 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
        .row { display: flex; gap: 10px; }
        .row input { flex: 1; }
        input, select, button { padding: 12px; font-size: 16px; border: 1px solid #ddd; border-radius: 10px; outline: none; width: 100%; margin-bottom: 10px; background: #fafafa; }
        input:focus, select:focus { border-color: #a55eea; background: white; }
        button { background: #a55eea; color: white; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-danger { background: #ff6b6b; }
        .btn-outline { background: transparent; color: #a55eea; border: 2px solid #a55eea; }
        .balance-box { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; padding: 8px 0; }
        .balance-box span { color: #a55eea; }
        .record-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
        .record-item .info { display: flex; gap: 12px; align-items: center; }
        .record-item .category { background: #f0f0f0; padding: 2px 10px; border-radius: 12px; font-size: 12px; color: #666; }
        .record-item .amount { font-weight: 600; color: #ff6b6b; }
        .record-item .amount.income { color: #2ed573; }
        .record-item .del { color: #ccc; font-size: 18px; cursor: pointer; padding: 0 6px; }
        .record-item .del:active { color: #ff6b6b; }
        .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-bar button { flex: 1; background: #f0f0f0; color: #333; border: none; padding: 10px; border-radius: 10px; font-size: 14px; }
        .tab-bar .active { background: #a55eea; color: white; }
        .chart-container { height: 180px; margin-top: 10px; }
        .empty-tip { text-align: center; color: #999; padding: 30px 0; font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; text-align: center; }
        .stats-grid div { background: #f8f9fa; padding: 10px; border-radius: 10px; }
        .stats-grid .num { font-size: 20px; font-weight: bold; color: #a55eea; }
        .stats-grid .label { font-size: 12px; color: #888; }
        .hidden { display: none; }
        #exportBtn { background: #2ed573; }
        #exportBtn:active { transform: scale(0.97); }
    </style>
</head>
<body>
<div class="container" id="app">

    <!-- ===== 顶部标签 ===== -->
    <div class="tab-bar">
        <button class="active" onclick="switchTab('record')">📝 记账</button>
        <button onclick="switchTab('stats')">📊 统计</button>
    </div>

    <!-- ===== 记账页 ===== -->
    <div id="tab-record">
        <div class="card">
            <h2>💰 记一笔</h2>
            <input id="desc" placeholder="项目（如：午餐）">
            <div class="row">
                <input id="amount" placeholder="金额" type="number" step="0.01">
                <select id="type" style="flex:0.7;">
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                </select>
            </div>
            <select id="category">
                <option value="餐饮">🍜 餐饮</option>
                <option value="交通">🚗 交通</option>
                <option value="购物">🛍️ 购物</option>
                <option value="娱乐">🎮 娱乐</option>
                <option value="工资">💼 工资</option>
                <option value="其他">📦 其他</option>
            </select>
            <button onclick="addRecord()">➕ 添加</button>
        </div>

        <div class="card">
            <div class="balance-box">
                <span>💰 余额</span>
                <span id="balance">0.00</span>
            </div>
            <div class="balance-box" style="font-size:14px;color:#888;">
                <span>📈 总收入</span>
                <span id="totalIncome">0.00</span>
                <span>📉 总支出</span>
                <span id="totalExpense">0.00</span>
            </div>
        </div>

        <div class="card">
            <h2>📋 流水</h2>
            <div id="recordList"></div>
        </div>
    </div>

    <!-- ===== 统计页 ===== -->
    <div id="tab-stats" class="hidden">
        <div class="card">
            <h2>📊 本月统计</h2>
            <div class="stats-grid" id="monthStats">
                <div><div class="num" id="mCount">0</div><div class="label">笔数</div></div>
                <div><div class="num" id="mIncome">0</div><div class="label">收入</div></div>
                <div><div class="num" id="mExpense">0</div><div class="label">支出</div></div>
            </div>
        </div>
        <div class="card">
            <h2>🧩 分类支出</h2>
            <div class="chart-container"><canvas id="categoryChart"></canvas></div>
        </div>
        <div class="card">
            <h2>📈 每日趋势</h2>
            <div class="chart-container"><canvas id="trendChart"></canvas></div>
        </div>
        <div class="card" style="display:flex; gap:8px;">
            <button id="exportBtn" onclick="exportData()" style="flex:1;">📤 导出数据</button>
            <button class="btn-danger" onclick="clearAll()" style="flex:1;">🗑️ 清空</button>
        </div>
    </div>

</div>

<script>
    let records = JSON.parse(localStorage.getItem('records')) || [];
    let chartCategory = null;
    let chartTrend = null;

    // ===== 切换标签 =====
    function switchTab(tab) {
        document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
        if (tab === 'record') {
            document.querySelector('.tab-bar button:first-child').classList.add('active');
            document.getElementById('tab-record').classList.remove('hidden');
            document.getElementById('tab-stats').classList.add('hidden');
        } else {
            document.querySelector('.tab-bar button:last-child').classList.add('active');
            document.getElementById('tab-record').classList.add('hidden');
            document.getElementById('tab-stats').classList.remove('hidden');
            renderStats();
        }
    }

    // ===== 添加记录 =====
    function addRecord() {
        const desc = document.getElementById('desc').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const type = document.getElementById('type').value;
        const category = document.getElementById('category').value;
        if (!desc || isNaN(amount) || amount <= 0) return alert('请完整填写项目和金额');
        records.push({
            desc,
            amount: type === 'expense' ? -amount : amount,
            category,
            date: new Date().toISOString()
        });
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
        save();
    }

    // ===== 删除 =====
    function del(i) {
        if (confirm('删除这条记录？')) {
            records.splice(i, 1);
            save();
        }
    }

    // ===== 清空 =====
    function clearAll() {
        if (confirm('确定要删除所有数据吗？⚠️')) {
            records = [];
            save();
        }
    }

    // ===== 保存 & 渲染 =====
    function save() {
        localStorage.setItem('records', JSON.stringify(records));
        renderRecords();
        updateBalance();
    }

    function renderRecords() {
        const list = document.getElementById('recordList');
        if (records.length === 0) {
            list.innerHTML = '<div class="empty-tip">暂无记录，记一笔吧 📝</div>';
            return;
        }
        let html = '';
        // 按日期倒序显示最近的在前
        const sorted = [...records].reverse();
        sorted.forEach((r, idx) => {
            const i = records.indexOf(r);
            const isIncome = r.amount > 0;
            const sign = isIncome ? '+' : '';
            const cls = isIncome ? 'income' : '';
            const date = new Date(r.date).toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' });
            html += `
                <div class="record-item">
                    <div class="info">
                        <span>${date}</span>
                        <span class="category">${r.category || '其他'}</span>
                        <span>${r.desc}</span>
                    </div>
                    <span>
                        <span class="amount ${cls}">${sign}${Math.abs(r.amount).toFixed(2)}</span>
                        <span class="del" onclick="del(${i})">✕</span>
                    </span>
                </div>
            `;
        });
        list.innerHTML = html;
    }

    function updateBalance() {
        let total = 0, income = 0, expense = 0;
        records.forEach(r => {
            total += r.amount;
            if (r.amount > 0) income += r.amount;
            else expense += Math.abs(r.amount);
        });
        document.getElementById('balance').textContent = total.toFixed(2);
        document.getElementById('totalIncome').textContent = income.toFixed(2);
        document.getElementById('totalExpense').textContent = expense.toFixed(2);
    }

    // ===== 统计页 =====
    function renderStats() {
        const now = new Date();
        const month = now.getMonth();
        const year = now.getFullYear();
        const monthRecords = records.filter(r => {
            const d = new Date(r.date);
            return d.getMonth() === month && d.getFullYear() === year;
        });
        let mIncome = 0, mExpense = 0;
        monthRecords.forEach(r => {
            if (r.amount > 0) mIncome += r.amount;
            else mExpense += Math.abs(r.amount);
        });
        document.getElementById('mCount').textContent = monthRecords.length;
        document.getElementById('mIncome').textContent = mIncome.toFixed(0);
        document.getElementById('mExpense').textContent = mExpense.toFixed(0);

        // 分类统计（仅支出）
        const catMap = {};
        records.filter(r => r.amount < 0).forEach(r => {
            const cat = r.category || '其他';
            catMap[cat] = (catMap[cat] || 0) + Math.abs(r.amount);
        });
        const catLabels = Object.keys(catMap);
        const catData = Object.values(catMap);

        // 分类饼图
        if (chartCategory) chartCategory.destroy();
        const ctx1 = document.getElementById('categoryChart').getContext('2d');
        chartCategory = new Chart(ctx1, {
            type: 'doughnut',
            data: {
                labels: catLabels.length ? catLabels : ['暂无数据'],
                datasets: [{ data: catLabels.length ? catData : [1], backgroundColor: ['#a55eea','#ff6b6b','#feca57','#54a0ff','#2ed573','#ff9ff3'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } } }
        });

        // 每日趋势（近7天）
        const days = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            days.push(d.toISOString().slice(0,10));
        }
        const trendData = days.map(day => {
            let sum = 0;
            records.filter(r => r.amount < 0 && r.date.startsWith(day)).forEach(r => sum += Math.abs(r.amount));
            return sum;
        });
        if (chartTrend) chartTrend.destroy();
        const ctx2 = document.getElementById('trendChart').getContext('2d');
        chartTrend = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: days.map(d => d.slice(5)),
                datasets: [{ label: '支出', data: trendData, borderColor: '#ff6b6b', tension: 0.2, fill: false }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    // ===== 导出数据 =====
    function exportData() {
        if (records.length === 0) return alert('没有数据可导出');
        let text = '日期,类型,分类,项目,金额\n';
        records.forEach(r => {
            const type = r.amount > 0 ? '收入' : '支出';
            text += `${r.date.slice(0,10)},${type},${r.category || '其他'},${r.desc},${Math.abs(r.amount).toFixed(2)}\n`;
        });
        const blob = new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `账本_${new Date().toISOString().slice(0,10)}.csv`;
        link.click();
    }

    // ===== 初始化 =====
    renderRecords();
    updateBalance();
</script>
</body>
</html>
